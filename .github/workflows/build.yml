name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with csc (small, no-runtime-dependency exe)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $files = (Get-ChildItem -Path "src" -Filter *.cs -Recurse).FullName + (Resolve-Path "Program.cs").Path
          & $csc /nologo /target:winexe /platform:anycpu /out:WinTrim.exe /reference:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Management.dll,Microsoft.CSharp.dll $files
          if ($LASTEXITCODE -ne 0) { throw "csc build failed" }

      - name: Verify the SDK-style project also builds
        run: dotnet build WinTrim.csproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTrim
          path: WinTrim.exe

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME WinTrim.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME WinTrim.exe --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes
          }
